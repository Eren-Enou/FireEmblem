# EXP-08 replaces EXP-01's per-frame AR write. It hooks the phase-advance function 0x8014D3B4
# (r3 = state; runs once per phase change, before the next phase starts) at its first instruction:
#   lis r12,0x802D ; lwz r12,-0x5D78(r12)       -> r12 = force 3 first unit (0x802CA288)
#   cmplwi r12,0 ; li r12,2 ; beq store ; li r12,1  -> 1 (human) if force 3 has units, else 2 (CPU, vanilla)
#   store: stb r12,0x17(r3)                      -> control[3]
#   lbz r0,0x11(r3) ; nop                        (original instruction)
$EXP-08 Yellow control set at each phase change (no per-frame write)
