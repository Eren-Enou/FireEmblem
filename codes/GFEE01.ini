# EXP-14 (Phase 2): controller port 2 drives the human yellow phase. The game reads input through one global
# "current pad" pointer at r13-0x7B60 (= 0x80367240; 320 loads, written once at init 0x80025C48 = pad object 0
# 0x802EF438). Pad objects (stride 0x24) are refreshed every frame from PADStatus[4] at 0x802EF408 (stride 0xC,
# err byte +0xA) by 0x80025970. Hook at that function's epilogue 0x80025B8C (r11/r12 free):
#   phase (0x80330719) == 3 && control[3] (0x8033071F) == 1 && PADStatus[1].err (0x802EF41E) != 0xFF (port 2 present)
#     -> current pad = pad object 1 (0x802EF45C), else pad object 0 (0x802EF438)
#   orig: lmw r27,0xC(r1)
$EXP-14 Controller port 2 drives the human yellow phase
