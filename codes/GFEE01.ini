#   phase (0x80330719) == 3 && control[3] (0x8033071F) == 1 && PADStatus[1].err (0x802EF41E) != 0xFF (port 2 present)
#     -> current pad = pad object 1 (0x802EF45C), else pad object 0 (0x802EF438)
#   orig: lmw r27,0xC(r1)
