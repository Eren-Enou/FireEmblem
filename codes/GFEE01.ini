# EXP-13: battle-result unit pickers. Five functions (0x801B6098, 0x801B6290, 0x801B6348, 0x801B67D0,
# 0x801B6BE4) choose the 'player' unit for result screens: battle copy A's real unit (0x80330EAC+0x280) if its
# force id is 0/5, else copy B's (+0x560) if 0/5, else NULL. EXP-12 level-up test: NULL -> invalid reads at
# 0x801B5E6C (unit+0x18C) / 0x801B5E90 (unit+0x19A) in the level-up screen. Each site is `cmplwi r0,5`
# right after `lbz r0,8(force)`; r0 and r12 are dead afterwards. Same cave as EXP-10 at all 10 sites.
$EXP-13 Level-up/result screens accept human-controlled yellow units
