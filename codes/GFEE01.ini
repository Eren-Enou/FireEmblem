# EXP-10 lets a human-controlled yellow army gain EXP. CanGainExp(unit) = 0x8003D13C only allows force id 0
# or 5 (0x8003D178 / 0x8003D180); 25 callers (battle EXP, AddExp, level-up, UI). Hook at 0x8003D180 (r0 = force id):
#   cmplwi r0,3 ; bne orig                          -> not yellow: unchanged
#   lis r12,0x8033 ; lbz r12,0x71F(r12) ; cmplwi r12,1 ; bne orig   -> yellow but CPU: unchanged (vanilla)
#   li r0,5                                          -> treat like force 5 (allowed)
#   orig: cmplwi r0,5 ; nop                          (original instruction)
$EXP-10 Human-controlled yellow units can gain EXP
