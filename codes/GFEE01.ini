# "current pad" pointer at r13-0x7B60 (= 0x80367240; 320 loads, written once at init 0x80025C48 = pad object 0
# 0x802EF438). Pad objects (stride 0x24) are refreshed every frame from PADStatus[4] at 0x802EF408 (stride 0xC,
