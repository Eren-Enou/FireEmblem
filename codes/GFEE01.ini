# Experiment codes for Fire Emblem: Path of Radiance (GFEE01, rev 0, main.dol sha1 9d00d7d4...)
# Install with: python -m tools.install_codes --enable EXP-NN  (Dolphin closed; writes User/GameSettings/GFEE01.ini)
# Each code's evidence is in docs/RESEARCH.md; procedures and results in docs/TESTING.md.
#
# AR encoding (Dolphin ActionReplay.cpp): address word = subtype<<30 | type<<27 | size<<25 | (addr & 0x1FFFFFF)
#   00XXXXXX 000000VV  = write byte VV to 0x80XXXXXX (every frame)
#   08XXXXXX 000000VV  = if byte at 0x80XXXXXX == VV, run the next line, else skip it
# 0x80330708 = battle-map state: +0x10 chapter id, +0x11 phase, +0x14+force = control (0 none, 1 human, 2 CPU).

[ActionReplay]
