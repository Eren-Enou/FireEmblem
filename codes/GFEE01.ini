# bit 0x20 clear; and the Next Unit button in 0x800291D8) is hard-wired to force 0. Both blocks pick force 3
# when phase == 3, else force 0 (vanilla):
#   lis r12,0x8033 ; lbz r12,0x719(r12) ; cmplwi r12,3 ; beq +8 ; li r12,0        -> r12 = 3 or 0
# Block 1 at 0x800AA5F8 (was lwz r4,0(r4) = force 0 head):  mulli r12,r12,12 ; lwzx r4,r4,r12
