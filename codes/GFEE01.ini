0033071E 00000001
$EXP-04 Enemy army (force 1, red) human-controlled
0033071D 00000001
$EXP-05 Redirect Chapter 1 (id 2) to Chapter 9 (id 10)
08330718 00000002
00330718 0000000A

# Gecko C2 = insert ASM at address; last word 00000000 becomes the branch back.
# EXP-06 hooks GetUnitSelectState (0x800284B4) at 0x8002858C, after the hostile/green/yellow checks
# (r29 = unit, r30 = unit force id, r31 = state 0x80330708):
#   lbz r0,0x11(r31) ; cmplw r30,r0 ; beq ok
#   li r3,3 ; lis r12,0x8002 ; ori r12,r12,0x85A4 ; mtctr r12 ; bctr   -> return 3 (not your unit)
#   ok: lwz r0,0x1A0(r29)                                                 (original instruction)
