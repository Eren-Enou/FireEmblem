# EXP-15 (Phase 4 proof, Chapter 1): fixed assignment Blue = Ike, Titania / Yellow = Boyd (PID_BOLE), Oscar
# (PID_OSCAR). Uses the game's own script command UnitTransferToForce (0x800BCA38(unit id, force); unlinks
# the unit from its force list, appends it to the new one, refreshes it; F-34). Enable with COOP-P3.
# Block 1 hooks the human-phase start step 0x8002E738 (runs at the start of every phase; first instruction):
#   stwu r1,-0x20(r1) ; mflr r0 ; stw r0,0x24(r1) ; save r3, r4, r31, r30
#   lis r12,0x8033 ; lbz r0,0x718(r12) ; cmpwi r0,2 ; bne done     -> chapter id 2 = Chapter 1 only
#   lbz r0,0x719(r12) ; cmpwi r0,0 ; bne done                     -> player (blue) phase only
#   bl past ; "PID_BOLE\0\0\0\0" "PID_OSCAR\0\0\0" ; past: mflr r31 ; li r30,2
#   loop: mr r3,r31 ; call 0x80016BDC (unit by PID) ; cmpwi r3,0 ; beq next
#         lwz r4,0x190(r3) ; lbz r0,8(r4) ; cmpwi r0,0 ; bne next   -> only if currently in force 0
#         lbz r3,0x198(r3) ; li r4,3 ; call 0x800BCA38              -> UnitTransferToForce(id, 3)
#   next: addi r31,r31,12 ; addic. r30,r30,-1 ; bne loop
#   done: restore ; stwu r1,-0x10(r1)                               (original instruction)
# Blocks 2-4 hand them back (same loop, force 3 -> 0, any chapter) at the entry of every chapter-end path
# found (F-38, F-39): the script command AllUnitEscape 0x800BA784 (the seize/clear event: escapes only force 0
# into the roster and frees forces 1-3; original stwu r1,-0x30(r1)), the turn-loop transition step 0x8002E0D0
# (stwu r1,-0x30(r1)) and the chapter-sequence step 0x80005F04 (stwu r1,-0x20(r1)).
# v1 hooked the roster move 0x80016C58 and v2 lacked AllUnitEscape: Boyd and Oscar were lost both times.
