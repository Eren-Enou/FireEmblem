# Experiment codes for Fire Emblem: Path of Radiance (GFEE01, rev 0, main.dol sha1 9d00d7d4...)
# Install with: python -m tools.install_codes --enable EXP-NN  (Dolphin closed; writes User/GameSettings/GFEE01.ini)
# Each code's evidence is in docs/RESEARCH.md; procedures and results in docs/TESTING.md.
#
# AR encoding (Dolphin ActionReplay.cpp): address word = subtype<<30 | type<<27 | size<<25 | (addr & 0x1FFFFFF)
#   00XXXXXX 000000VV  = write byte VV to 0x80XXXXXX (every frame)
#   08XXXXXX 000000VV  = if byte at 0x80XXXXXX == VV, run the next line, else skip it
# 0x80330708 = battle-map state: +0x10 chapter id, +0x11 phase, +0x14+force = control (0 none, 1 human, 2 CPU).

[ActionReplay]
$EXP-01 Partner army (force 3, yellow) human-controlled
0033071F 00000001
$EXP-02 Other army (force 2, green) human-controlled
0033071E 00000001
$EXP-04 Enemy army (force 1, red) human-controlled
0033071D 00000001
$EXP-05 Redirect Chapter 1 (id 2) to Chapter 9 (id 10)
08330718 00000002
00330718 0000000A

# Gecko C2 = insert ASM at address; last word 00000000 becomes the branch back.
# EXP-06 hooks GetUnitSelectState (0x800284B4) at 0x8002858C, after the hostile/green/yellow checks
# (r29 = unit, r30 = unit force id, r31 = state 0x80330708):
#   lbz r0,0x11(r31) ; cmplw r30,r0 ; beq ok
#   li r3,3 ; lis r12,0x8002 ; ori r12,r12,0x85A4 ; mtctr r12 ; bctr   -> return 3 (not your unit)
#   ok: lwz r0,0x1A0(r29)                                                 (original instruction)
