# EXP-07 hooks the phase-end handler 0x8002E670 at 0x8002E6DC (phase-3 branch), which launches the
# computer-player proc E_CP_PhaseMain without checking control[3]. Phases 1/2 already require
# control == 2 (0x8002E708). Mirror that (r31 = state 0x80330708):
